name: Packaging checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run packaging Python tests
        run: python3 -m unittest discover -s packaging -p 'test_*.py'
      - name: Check shell syntax
        run: |
          set -euo pipefail
          for script in packaging/*.sh scripts/*.sh; do
            bash -n "$script"
          done
