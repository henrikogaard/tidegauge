[package]
name = "tidegauge"
version = "0.1.0"
description = "A menu-bar system monitor for macOS. Every process grouped under its app, 30 days of history, alerts when something misbehaves."
edition = "2021"
license = "MIT"
publish = false

[dependencies]
gpui-kit = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
smol = "2"
anyhow = "1"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication", "NSImage", "NSResponder", "NSStatusBar", "NSStatusItem",
    "NSButton", "NSMenu", "NSMenuItem", "NSWorkspace", "NSBitmapImageRep",
    "NSGraphicsContext", "NSScreen", "NSWindow", "NSView", "NSColor", "NSFont",
    "NSAttributedString", "NSEvent", "NSRunningApplication", "NSBezierPath",
    "NSPasteboard", "NSAccessibility", "NSStringDrawing", "NSGraphics", "NSAppearance", "NSAlert", "NSPanel", "block2",
    "NSColorSpace", "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSData", "NSDictionary", "NSObject", "NSString", "NSArray", "NSValue",
    "NSGeometry", "NSProcessInfo", "NSURL", "NSBundle", "NSError", "NSLocale", "NSFileManager",
] }
objc2-core-foundation = "0.3"
# Wi-Fi signal, channel and rate. SSID and BSSID are left out on purpose:
# macOS asks for Location permission to read them.
objc2-core-wlan = { version = "0.3.2", default-features = false, features = [
    "std", "CWWiFiClient", "CWInterface", "CWChannel", "CoreWLANTypes",
] }
block2 = "0.6"
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
    "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse",
    "UNNotificationTrigger", "UNUserNotificationCenter", "block2",
] }

[dev-dependencies]
# Source-level language-isolation guard in src/locale_guard.rs.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }

[profile.release]
lto = "thin"
codegen-units = 1
